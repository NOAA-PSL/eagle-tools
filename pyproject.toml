# pyproject.toml

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle-tools"
dynamic = ["version"]
authors = [
  { name="Timothy Smith", email="tim.smith@noaa.gov" },
]
description = "Tools for processing and evaluating anemoi based EAGLE ML models."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Minimal core: enough to run the CLI and the lightweight commands.
# Everything else is opt-in via the extras below.
dependencies = [
    "click",
    "pyyaml",
    "numpy",
    "pandas",
    "xarray",
    "zarr<3",
]

[project.optional-dependencies]
# Only what official EAGLE pipeline uses
eagle-pipeline = [
    "anemoi-inference",
    "anemoi-datasets",
    "ufs2arco>=0.17.2",
]

# Figures & movies (eagle-tools figures/movies)
plotting = [
    "matplotlib",
    "cartopy",
    "cmocean",
    "anemoi-datasets",
    "ufs2arco>=0.17.2",
]

# Error metrics / spatial maps / power spectra
# (eagle-tools metrics, spatial, spectra)
evaluation = [
    "scipy",
    "anemoi-datasets",
    "ufs2arco>=0.17.2",
    "anemoi-training",  # spectra.py
    "nnja-ai[complete]>=1.0.0"
]

# Sync MLflow logs to Azure ML (eagle-tools amlsync)
aml = [
    "mlflow",
    "azure-ai-ml",
]

# Everything that is pip-installable.
all = [
    "eagle-tools[eagle-pipeline,plotting,evaluation,aml]",
    "nnja-ai[complete]>=1.0.0",
]

# Conda-only dependencies (not pip-installable):
#   xesmf      -> needed by eagle.tools.postprocess
#   mpi/mpi4py -> needed for MPI-parallelized metrics/spectra runs


# This tells setuptools where to find your package(s)
[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
eagle-tools = "eagle.tools.cli:cli"

[tool.setuptools.package-data]
"eagle.tools.config" = ["*.yaml"]
