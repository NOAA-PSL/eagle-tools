checkpoint_path: "static/global-mini.sanitised.ckpt"
device: cpu
lead_time: 24

start_date: "2026-01-12T06:00:00"
end_date: "2026-01-12T06:00:00"
freq: "6h"

input_dataset_kwargs:
  dataset: "gfs.zarr"

output_path: forecasts

output_format: grib

vars_to_drop:
  - u80
  - v80

patch_metadata:
  dataset:
    data:
      data_request:
        grid: [1.0, 1.0]
        area: [90, 0, -89, 359]
      variables_metadata:
        sh2:
          mars:
            param: 2sh
        t2m:
          mars:
            param: 2t
        t_surface:
          mars:
            param: skt
        sp:
          mars:
            param: sp
        u10:
          mars:
            param: 10u
        v10:
          mars:
            param: 10v
        u_100:
          mars:
            param: 100u
        u_200:
          mars:
            param: 200u
        v_100:
          mars:
            param: 100v
        v_200:
          mars:
            param: 200v

